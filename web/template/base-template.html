<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{PRESENTATION_TITLE}}</title>
<style>
/* ============================================
   AutoPresent Studio — 웹 프레젠테이션 엔진
   단일 HTML 파일, 외부 의존성 없음
   ============================================ */

/* --- CSS 변수 (ThemeAgent가 주입) --- */
:root {
  --color-primary: {{COLOR_PRIMARY}};
  --color-secondary: {{COLOR_SECONDARY}};
  --color-accent: {{COLOR_ACCENT}};
  --color-bg: {{COLOR_BACKGROUND}};
  --color-surface: {{COLOR_SURFACE}};
  --color-text: {{COLOR_TEXT}};
  --color-text-secondary: {{COLOR_TEXT_SECONDARY}};
  --font-heading: {{FONT_HEADING}};
  --font-body: {{FONT_BODY}};
  --gradient-primary: {{GRADIENT_PRIMARY}};
  --gradient-bg: {{GRADIENT_BACKGROUND}};
}

/* --- 리셋 & 기본 --- */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--color-bg); color: var(--color-text); font-family: var(--font-body), 'Pretendard', sans-serif; }

/* --- 슬라이드 컨테이너 --- */
.slide-container { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
.slide {
  position: absolute; inset: 0;
  display: none; flex-direction: column;
  padding: 80px 120px;
  opacity: 0; transition: opacity 0.4s ease;
}
.slide.active { display: flex; opacity: 1; }

/* --- 프래그먼트 애니메이션 --- */
[data-fragment] { opacity: 0; transform: translateY(20px); transition: opacity 0.5s ease, transform 0.5s ease; }
[data-fragment].visible { opacity: 1; transform: translateY(0); }
[data-fragment].fade.visible { opacity: 1; }
[data-fragment].slide-up.visible { transform: translateY(0); }
[data-fragment].slide-left { transform: translateX(-30px); }
[data-fragment].slide-left.visible { transform: translateX(0); }
[data-fragment].zoom { transform: scale(0.8); }
[data-fragment].zoom.visible { transform: scale(1); }

/* --- 슬라이드 타입별 레이아웃 --- */

/* cover */
.slide-cover { justify-content: center; align-items: center; text-align: center; background: var(--gradient-bg); }
.slide-cover .badge { font-size: 18px; color: var(--color-primary); border: 1px solid var(--color-primary); border-radius: 20px; padding: 6px 20px; letter-spacing: 2px; margin-bottom: 24px; }
.slide-cover h1 { font-size: 68px; font-weight: 800; font-family: var(--font-heading), sans-serif; line-height: 1.2; margin-bottom: 16px; }
.slide-cover .subtitle { font-size: 30px; color: var(--color-text-secondary); margin-bottom: 48px; }
.slide-cover .meta { font-size: 18px; color: var(--color-text-secondary); display: flex; gap: 24px; justify-content: center; }

/* toc */
.slide-toc h1 { font-size: 48px; font-weight: 700; margin-bottom: 40px; }
.toc-grid { display: flex; flex-wrap: wrap; gap: 20px; }
.toc-item { width: calc(50% - 10px); display: flex; align-items: center; gap: 16px; padding: 18px 22px; border-radius: 12px; background: rgba(108,99,255,0.08); border-left: 3px solid var(--color-primary); }
.toc-item .num { font-size: 22px; font-weight: 700; color: var(--color-primary); min-width: 32px; }
.toc-item .label { font-size: 22px; }

/* bullets */
.slide-bullets h1 { font-size: 48px; font-weight: 700; margin-bottom: 36px; }
.bullet-item { display: flex; align-items: flex-start; gap: 14px; padding: 14px 22px; border-radius: 10px; margin-bottom: 14px; background: rgba(255,255,255,0.03); border-left: 4px solid transparent; }
.bullet-item.highlight { background: rgba(108,99,255,0.12); border-left-color: var(--color-primary); }
.bullet-dot { color: var(--color-primary); font-size: 18px; margin-top: 4px; flex-shrink: 0; }
.bullet-text { font-size: 26px; line-height: 1.5; }
.bullet-item.highlight .bullet-text { color: var(--color-text); }
.bullet-item:not(.highlight) .bullet-text { color: var(--color-text-secondary); }

/* stats */
.slide-stats h1 { font-size: 48px; font-weight: 700; margin-bottom: 40px; }
.stats-grid { display: flex; gap: 28px; justify-content: center; flex-wrap: wrap; flex: 1; align-items: center; }
.stat-box { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 36px 44px; text-align: center; min-width: 180px; }
.stat-box.highlight { background: rgba(108,99,255,0.15); border-color: var(--color-primary); }
.stat-value { font-size: 52px; font-weight: 800; margin-bottom: 8px; }
.stat-box.highlight .stat-value { color: var(--color-primary); }
.stat-label { font-size: 18px; color: var(--color-text-secondary); }
.stats-callout { font-size: 22px; text-align: center; margin-top: 24px; padding: 14px 28px; background: rgba(108,99,255,0.08); border-radius: 10px; }
.stats-source { font-size: 14px; color: #666; text-align: right; margin-top: 12px; }

/* table */
.slide-table h1 { font-size: 48px; font-weight: 700; margin-bottom: 36px; }
.table-wrap { flex: 1; overflow: hidden; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); }
.table-wrap table { width: 100%; border-collapse: collapse; }
.table-wrap thead { background: rgba(108,99,255,0.2); }
.table-wrap th { padding: 16px 20px; font-size: 20px; font-weight: 700; text-align: left; border-right: 1px solid rgba(255,255,255,0.1); }
.table-wrap th:last-child { border-right: none; }
.table-wrap td { padding: 14px 20px; font-size: 18px; color: var(--color-text-secondary); border-right: 1px solid rgba(255,255,255,0.05); }
.table-wrap td:last-child { border-right: none; }
.table-wrap tr:nth-child(even) { background: rgba(255,255,255,0.03); }
.table-wrap tr:nth-child(odd) { background: rgba(255,255,255,0.06); }
.table-callout { font-size: 18px; color: var(--color-text-secondary); margin-top: 16px; font-style: italic; }

/* timeline */
.slide-timeline h1 { font-size: 48px; font-weight: 700; margin-bottom: 40px; }
.timeline-list { position: relative; padding-left: 40px; }
.timeline-line { position: absolute; left: 16px; top: 0; bottom: 0; width: 3px; background: rgba(108,99,255,0.3); }
.timeline-item { display: flex; align-items: flex-start; gap: 20px; margin-bottom: 32px; position: relative; }
.timeline-dot { width: 14px; height: 14px; border-radius: 50%; background: var(--color-primary); border: 3px solid var(--color-surface); flex-shrink: 0; margin-top: 6px; margin-left: -7px; }
.timeline-date { font-size: 16px; font-weight: 700; color: var(--color-primary); margin-bottom: 2px; }
.timeline-label { font-size: 24px; font-weight: 600; margin-bottom: 4px; }
.timeline-desc { font-size: 18px; color: var(--color-text-secondary); line-height: 1.4; }

/* problem-solution */
.slide-ps h1 { font-size: 48px; font-weight: 700; margin-bottom: 36px; }
.ps-container { display: flex; gap: 28px; flex: 1; }
.ps-section { flex: 1; border-radius: 16px; padding: 32px 36px; }
.ps-problem { background: rgba(255,101,132,0.08); border: 1px solid rgba(255,101,132,0.2); }
.ps-solution { background: rgba(78,203,113,0.08); border: 1px solid rgba(78,203,113,0.2); }
.ps-section h2 { font-size: 26px; font-weight: 700; margin-bottom: 20px; }
.ps-problem h2 { color: #FF6584; }
.ps-solution h2 { color: #4ECB71; }
.ps-point { display: flex; gap: 10px; margin-bottom: 12px; font-size: 20px; line-height: 1.4; }
.ps-arrow { display: flex; align-items: center; font-size: 36px; color: var(--color-text-secondary); }

/* quote */
.slide-quote { justify-content: center; align-items: center; text-align: center; padding: 100px 140px; background: var(--gradient-bg); }
.quote-mark { font-size: 180px; color: var(--color-primary); opacity: 0.25; line-height: 0.8; margin-bottom: -30px; align-self: flex-start; }
.quote-text { font-size: 38px; font-weight: 500; font-style: italic; line-height: 1.6; }
.quote-source { font-size: 22px; color: var(--color-text-secondary); margin-top: 36px; }

/* team */
.slide-team h1 { font-size: 48px; font-weight: 700; margin-bottom: 40px; }
.team-grid { display: flex; gap: 22px; justify-content: center; flex-wrap: wrap; flex: 1; align-items: center; }
.member-card { width: 240px; background: rgba(255,255,255,0.05); border-radius: 16px; padding: 28px 20px; text-align: center; border: 1px solid rgba(255,255,255,0.08); }
.member-avatar { width: 72px; height: 72px; border-radius: 50%; background: var(--color-primary); margin: 0 auto 16px; display: flex; justify-content: center; align-items: center; font-size: 28px; font-weight: 700; }
.member-name { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
.member-role { font-size: 16px; color: var(--color-primary); margin-bottom: 10px; }
.member-career { font-size: 14px; color: var(--color-text-secondary); line-height: 1.4; }

/* conclusion */
.slide-conclusion { justify-content: center; align-items: center; text-align: center; background: var(--gradient-bg); }
.slide-conclusion h1 { font-size: 60px; font-weight: 800; margin-bottom: 14px; }
.slide-conclusion .subtitle { font-size: 26px; color: var(--color-text-secondary); margin-bottom: 36px; }
.conclusion-summary { width: 100%; max-width: 800px; text-align: left; margin-bottom: 24px; }
.summary-item { display: flex; gap: 10px; margin-bottom: 10px; font-size: 22px; }
.summary-icon { color: var(--color-primary); }
.conclusion-checklist { width: 100%; max-width: 800px; text-align: left; margin-bottom: 24px; }
.check-item { display: flex; gap: 10px; margin-bottom: 8px; font-size: 20px; color: var(--color-text-secondary); }
.check-icon { color: #4ECB71; }
.cta-btn { display: inline-block; padding: 14px 44px; background: var(--color-primary); border-radius: 30px; font-size: 22px; font-weight: 700; margin-top: 16px; }

/* --- 진행바 --- */
.progress-bar { position: fixed; bottom: 0; left: 0; height: 4px; background: var(--color-primary); transition: width 0.3s ease; z-index: 100; }

/* --- 슬라이드 번호 --- */
.slide-number { position: fixed; bottom: 16px; right: 24px; font-size: 14px; color: var(--color-text-secondary); opacity: 0.6; z-index: 100; }

/* --- 반응형 --- */
@media (max-width: 1024px) {
  .slide { padding: 40px 60px; }
  .slide-cover h1 { font-size: 48px; }
  .toc-item, .bullet-item { width: 100%; }
  .ps-container { flex-direction: column; }
}
</style>
</head>
<body>

<div class="slide-container" id="slideContainer">
  <!-- {{SLIDES_HTML}} — WebAgent가 여기에 슬라이드 HTML을 삽입합니다 -->
</div>

<!-- 진행바 -->
<div class="progress-bar" id="progressBar"></div>

<!-- 슬라이드 번호 -->
<div class="slide-number" id="slideNumber"></div>

<script>
/* ============================================
   AutoPresent Studio — 프레젠테이션 엔진
   ============================================ */
(function() {
  'use strict';

  let currentSlide = 0;
  let currentFragment = -1;
  const slides = document.querySelectorAll('.slide');
  const totalSlides = slides.length;

  // 초기화
  function init() {
    if (totalSlides === 0) return;
    showSlide(0);
    updateProgress();
    bindEvents();
  }

  // 슬라이드 표시
  function showSlide(index) {
    slides.forEach((s, i) => {
      s.classList.toggle('active', i === index);
    });
    currentSlide = index;
    currentFragment = -1;
    updateProgress();
  }

  // 프래그먼트 가져오기
  function getFragments(slideIndex) {
    const slide = slides[slideIndex];
    if (!slide) return [];
    return Array.from(slide.querySelectorAll('[data-fragment]'))
      .sort((a, b) => parseInt(a.dataset.fragment) - parseInt(b.dataset.fragment));
  }

  // 다음 (프래그먼트 → 다음 슬라이드)
  function next() {
    const fragments = getFragments(currentSlide);
    const nextFrag = currentFragment + 1;

    if (nextFrag < fragments.length) {
      fragments[nextFrag].classList.add('visible');
      currentFragment = nextFrag;
    } else if (currentSlide < totalSlides - 1) {
      showSlide(currentSlide + 1);
      // 새 슬라이드의 프래그먼트 없으면 전체 표시
      const newFragments = getFragments(currentSlide);
      if (newFragments.length === 0) {
        // 프래그먼트 없는 슬라이드는 바로 표시
      }
    }
  }

  // 이전
  function prev() {
    const fragments = getFragments(currentSlide);

    if (currentFragment >= 0) {
      fragments[currentFragment].classList.remove('visible');
      currentFragment--;
    } else if (currentSlide > 0) {
      showSlide(currentSlide - 1);
      // 이전 슬라이드 프래그먼트 모두 표시
      const prevFragments = getFragments(currentSlide);
      prevFragments.forEach(f => f.classList.add('visible'));
      currentFragment = prevFragments.length - 1;
    }
  }

  // 진행바 + 슬라이드 번호 업데이트
  function updateProgress() {
    const pct = totalSlides > 1 ? (currentSlide / (totalSlides - 1)) * 100 : 100;
    document.getElementById('progressBar').style.width = pct + '%';
    document.getElementById('slideNumber').textContent = (currentSlide + 1) + ' / ' + totalSlides;
  }

  // 이벤트 바인딩
  function bindEvents() {
    // 키보드
    document.addEventListener('keydown', function(e) {
      switch(e.key) {
        case 'ArrowRight': case 'ArrowDown': case ' ': case 'Enter':
          e.preventDefault(); next(); break;
        case 'ArrowLeft': case 'ArrowUp': case 'Backspace':
          e.preventDefault(); prev(); break;
        case 'Home': e.preventDefault(); showSlide(0); break;
        case 'End': e.preventDefault(); showSlide(totalSlides - 1); break;
        case 'f': case 'F':
          e.preventDefault(); toggleFullscreen(); break;
      }
    });

    // 터치/스와이프
    let touchStartX = 0;
    let touchStartY = 0;
    document.addEventListener('touchstart', function(e) {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: true });

    document.addEventListener('touchend', function(e) {
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
        dx < 0 ? next() : prev();
      }
    }, { passive: true });

    // 클릭 (좌/우 영역)
    document.addEventListener('click', function(e) {
      const x = e.clientX / window.innerWidth;
      if (x > 0.65) next();
      else if (x < 0.35) prev();
    });
  }

  // 풀스크린 토글
  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen();
    }
  }

  // 실행
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
